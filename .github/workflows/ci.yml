name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Validate · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mimd
          POSTGRES_PASSWORD: mimd
          POSTGRES_DB: mimd_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimd -d mimd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mimd:mimd@localhost:5432/mimd_ci?schema=public
      # Throwaway key for CI only (32 zero bytes, base64). Never use outside CI.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma validate + generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Apply migrations (checks migrations match a clean database)
        run: npx prisma migrate deploy

      - name: Detect schema drift (schema.prisma vs migrations)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Seed smoke test (demo data loads)
        run: npm run db:seed

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
