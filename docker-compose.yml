# ─────────────────────────────────────────────────────────────────────────────
# Production stack for a Hostinger VPS (or any Docker host).
#
#   cp .env.example .env.production   # fill in secrets, DOMAIN, POSTGRES_*
#   docker compose --env-file .env.production up -d --build
#
# Services: db (postgres:16) → migrate (one-shot) → app + worker → caddy (HTTPS).
# Demo seed (staging only):  docker compose --env-file .env.staging --profile demo run --rm seed
# See docs/deployment-hostinger.md.
# ─────────────────────────────────────────────────────────────────────────────
name: mimd

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-mimd}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mimd}?schema=public
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  APP_URL: ${APP_URL:-https://${DOMAIN}}
  NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Marketing Intelligence}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ar}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOAD_DIR: /app/uploads
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  CRON_SECRET: ${CRON_SECRET:-}
  WORKER_POLL_MS: ${WORKER_POLL_MS:-}
  WORKER_BATCH: ${WORKER_BATCH:-}
  CONTENT_CONFLICT_WINDOW_MINUTES: ${CONTENT_CONFLICT_WINDOW_MINUTES:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_AD_LIBRARY_TOKEN: ${META_AD_LIBRARY_TOKEN:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
  GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
  GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-}
  TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
  TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
  X_CLIENT_ID: ${X_CLIENT_ID:-}
  X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
  MS_CLIENT_ID: ${MS_CLIENT_ID:-}
  MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
  MS_TENANT_ID: ${MS_TENANT_ID:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mimd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    # Not published to the host. For a local psql: docker compose exec db psql -U mimd

  migrate:
    build: { context: ., target: worker }
    image: mimd-worker:${IMAGE_TAG:-latest}
    # Migrate, then (first boot only) create the organization + Super Admin — no demo data.
    command: ["sh", "-c", "npx prisma migrate deploy && node node_modules/tsx/dist/cli.mjs scripts/seed-if-empty.ts"]
    init: true
    environment:
      <<: *app-env
      ORG_NAME: ${ORG_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ORG_CURRENCY: ${ORG_CURRENCY:-EGP}
      ORG_TIMEZONE: ${ORG_TIMEZONE:-Africa/Cairo}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  app:
    build: { context: ., target: app }
    image: mimd-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]
    logging: *logging

  worker:
    image: mimd-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    command: ["node", "node_modules/tsx/dist/cli.mjs", "worker/index.ts"]
    stop_grace_period: 70s # worker finishes its batch on SIGTERM (forced exit after 60 s)
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

  # Demo data — NEVER run against production. Enabled only with `--profile demo`.
  seed:
    image: mimd-worker:${IMAGE_TAG:-latest}
    profiles: ["demo"]
    command: ["node", "node_modules/tsx/dist/cli.mjs", "prisma/seed.ts"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
