# nginx site for the non-Docker deployment (PM2 on a Hostinger VPS).
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/mimd.conf
#           sudo sed -i 's/dashboard.example.com/<your-domain>/g' /etc/nginx/sites-available/mimd.conf
#           sudo ln -s /etc/nginx/sites-available/mimd.conf /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d <your-domain>        # obtains + auto-renews Let's Encrypt
#           sudo nginx -t && sudo systemctl reload nginx
# Also usable in front of Docker if you prefer nginx over Caddy (proxy to 127.0.0.1:3000 after
# publishing the app port on localhost only: ports: ["127.0.0.1:3000:3000"]).

upstream mimd_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS (certbot's challenge location keeps working)
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (HSTS, CSP, frame options…) are emitted by the app — see next.config.ts.
    server_tokens off;

    client_max_body_size 30m;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets — cache for a year.
    location /_next/static/ {
        proxy_pass http://mimd_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cheap per-IP limit on auth + public endpoints (in addition to the app's own limiter).
    # Requires in http{}:  limit_req_zone $binary_remote_addr zone=mimd_auth:10m rate=10r/m;
    # location = /login { limit_req zone=mimd_auth burst=20 nodelay; proxy_pass http://mimd_app; include /etc/nginx/proxy_params; }

    location / {
        proxy_pass http://mimd_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    access_log /var/log/nginx/mimd.access.log;
    error_log  /var/log/nginx/mimd.error.log warn;
}
