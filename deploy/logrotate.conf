# logrotate policy for the non-Docker deployment (PM2 log files).
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/mimd   (adjust the path if not /opt/mimd)
# Alternative: `pm2 install pm2-logrotate`. Docker logs are rotated by the json-file driver
# settings in docker-compose.yml (10 MB × 5 files per container). nginx ships its own policy.
/opt/mimd/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su mimd mimd
}
