# One-click deployment on Render (https://render.com/docs/blueprint-spec).
# Creates a PostgreSQL database + one web service and runs the background worker inside it.
# First boot on an empty database creates your organization and first Super Admin from
# ORG_NAME / ADMIN_EMAIL / ADMIN_PASSWORD — with NO sample data. Set DEMO_MODE=true instead
# only if you want the clearly-labelled demo workspace. For production see docs/deployment-hostinger.md.
databases:
  - name: mimd-db
    plan: free
    databaseName: mimd
    user: mimd

services:
  - type: web
    name: marketing-intelligence-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: bash scripts/start-demo.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mimd-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true # random 256-bit base64 value
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: ORG_NAME
        sync: false # e.g. your company name
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false # 10+ chars, letters and digits — change it after first login
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: DEFAULT_LOCALE
        value: ar
      - key: NEXT_PUBLIC_APP_NAME
        value: Marketing Intelligence
      # Optional: ANTHROPIC_API_KEY enables the AI assistant; SMTP_* enables e-mail.
      - key: ANTHROPIC_API_KEY
        sync: false
